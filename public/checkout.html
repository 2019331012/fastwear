<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Checkout | FastWear</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" /></head><body>
<div class="container">
  <header class="site-header">
    <div class="header-left"><div class="logo" onclick="location.href='/'"><i class="fas fa-bolt"></i> FastWear</div></div>
    <div class="header-right">
      <div class="cart-info" id="cartInfoBtn"><i class="fas fa-shopping-bag"></i><span class="amount" id="headerTotal">0.00৳</span><span id="headerCount">0</span></div>
      <span id="userSlot"></span>
    </div>
  </header>
  <div class="page-title"><h1>Checkout</h1><p>No account needed — pay cash on delivery</p></div>
  <div class="guest-note" id="guestNote" style="display:none;"><i class="fas fa-info-circle"></i>
    Ordering as guest. <a href="/login?redirect=/checkout" style="color:#1e1e1e;font-weight:600;">Log in</a> to use bKash/Card and get order history.
  </div>
  <div class="checkout-grid" id="checkoutGrid">
    <div class="checkout-card">
      <h2>Shipping details</h2>
      <form id="checkoutForm">
        <div class="form-group"><label>Full name</label><input name="shipping_name" required /></div>
        <div class="form-group"><label>Email (for order updates)</label><input type="email" name="shipping_email" required /></div>
        <div class="form-group"><label>Phone</label><input name="shipping_phone" required /></div>
        <div class="form-group"><label>Address</label><textarea name="shipping_address" required></textarea></div>
        <div class="form-group"><label>Payment method</label>
          <select name="payment_method" id="paymentSelect">
            <option value="cod">Cash on Delivery</option>
            <option value="bkash" data-user-only>bKash (mock)</option>
            <option value="card" data-user-only>Card (mock)</option>
          </select>
        </div>
        <div class="form-error" id="error"></div>
        <button type="submit" class="btn-primary" id="placeOrderBtn">Place order</button>
      </form>
    </div>
    <div class="checkout-card">
      <h2>Order summary</h2>
      <div id="summaryItems"></div>
      <div class="summary-total"><span>Total</span><span id="summaryTotal">0.00৳</span></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/js/auth.js"></script><script src="/js/checkout.js"></script>
</body></html>
