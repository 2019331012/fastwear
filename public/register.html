<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Register | FastWear</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" /></head><body>
<div class="container" style="min-height:80vh;">
  <header class="site-header"><div class="header-left"><div class="logo" onclick="location.href='/'"><i class="fas fa-bolt"></i> FastWear</div></div></header>
  <div class="auth-wrap">
    <h1>Create account</h1><p class="sub">Join FastWear in seconds</p>
    <form id="registerForm">
      <div class="form-group"><label>Name</label><input name="name" required /></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
      <div class="form-group"><label>Phone</label><input name="phone" placeholder="Optional" /></div>
      <div class="form-group"><label>Address</label><textarea name="address" placeholder="Optional"></textarea></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6" /></div>
      <div class="form-error" id="error"></div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>
    <div class="form-link">Already have an account? <a href="/login">Log in</a></div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const err = document.getElementById('error'); err.textContent = '';
  try {
    // await FW.api('/api/auth/register', { method: 'POST', body: JSON.stringify({
    //   name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'), address: fd.get('address'), password: fd.get('password')
    // })});
    // location.href = '/';

    const data = await FW.api('/api/auth/register', { method: 'POST', body: JSON.stringify({
      name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'), address: fd.get('address'), password: fd.get('password')
    })});
    localStorage.setItem('fastwear_token', data.token);
    location.href = '/';

  } catch (e) { err.textContent = e.message; }
});
</script>
</body></html>
