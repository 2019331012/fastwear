<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Login | FastWear</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" /></head><body>
<div class="container" style="min-height:80vh;">
  <header class="site-header"><div class="header-left"><div class="logo" onclick="location.href='/'"><i class="fas fa-bolt"></i> FastWear</div></div></header>
  <div class="auth-wrap">
    <h1>Welcome back</h1><p class="sub">Log in to your account</p>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required /></div>
      <div class="form-error" id="error"></div>
      <button type="submit" class="btn-primary">Log in</button>
    </form>
    <div class="form-link">No account? <a href="/register">Create one</a></div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const err = document.getElementById('error'); err.textContent = '';
  try {
    // await FW.api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }) });
    // const u = new URLSearchParams(location.search).get('redirect');
    // location.href = u || '/';

    const data = await FW.api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }) });
    localStorage.setItem('fastwear_token', data.token);
    const u = new URLSearchParams(location.search).get('redirect');
    location.href = u || '/';

  } catch (e) { err.textContent = e.message; }
});
</script>
</body></html>
