<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Admin | FastWear</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" /></head><body>
<div class="container">
  <header class="site-header">
    <div class="header-left">
      <div class="logo" onclick="location.href='/'"><i class="fas fa-bolt"></i> FastWear</div>
      <span style="font-size:.8rem;background:#1e1e1e;color:#fff;padding:.25rem .6rem;border-radius:20px;">Admin</span>
    </div>
    <div class="header-right"><span id="userSlot"></span></div>
  </header>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="products">Products</button>
    <button class="admin-tab" data-tab="orders">Orders</button>
  </div>
  <div id="productsTab">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h2 style="font-size:1.2rem;">Products</h2>
      <button class="btn-primary" style="width:auto;padding:.6rem 1.2rem;" id="newProductBtn"><i class="fas fa-plus"></i> New product</button>
    </div>
    <table class="admin-table"><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="productsBody"></tbody></table>
  </div>
  <div id="ordersTab" style="display:none;">
    <h2 style="font-size:1.2rem;margin-bottom:1rem;">All orders</h2>
    <div id="ordersBody"></div>
  </div>
</div>
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <h3 id="modalTitle">New product</h3>
    <form id="productForm">
      <input type="hidden" name="id" />
      <div class="form-group"><label>Name</label><input name="name" required /></div>
      <div class="form-group"><label>Slug</label><input name="slug" required pattern="[a-z0-9-]+" /></div>
      <div class="form-group"><label>Description</label><textarea name="description"></textarea></div>
      <div class="form-group"><label>Category</label>
        <select name="category" required>
          <option value="boxer">Boxer</option><option value="tshirt">T-Shirt</option>
          <option value="drop-shoulder">Drop Shoulder</option><option value="denim">Denim</option>
          <option value="hoodie">Hoodie</option><option value="combo">Combo</option>
        </select>
      </div>
      <div class="form-group"><label>Price (৳)</label><input name="price" type="number" step="0.01" required /></div>
      <div class="form-group"><label>Old price</label><input name="old_price" type="number" step="0.01" /></div>
      <div class="form-group"><label>Stock</label><input name="stock" type="number" value="100" /></div>
      <div class="form-group"><label>Image (JPG/PNG/WebP)</label><input type="file" name="image" accept="image/*" /></div>
      <img class="image-preview" id="imagePreview" style="display:none;" />
      <div class="form-error" id="modalError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelModal">Cancel</button>
        <button type="submit" class="btn-primary" style="width:auto;padding:.75rem 1.5rem;">Save</button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/js/auth.js"></script><script src="/js/admin.js"></script>
</body></html>
